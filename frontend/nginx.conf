server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Дозволяємо завантаження постерів (бекенд обмежує 5 МБ).
    client_max_body_size 10m;

    # API → бекенд (глобальний префікс /api задано в NestJS).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Завантажені постери роздає бекенд (ServeStatic /uploads).
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA: усі інші шляхи віддаємо index.html (історія Vue Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
