<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Тінь для елементів -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.35" flood-color="#000000"/>
        </filter>

        <!-- Градієнт для плівки -->
        <linearGradient id="filmGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>

        <!-- Градієнт для галочки -->
        <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4ade80"/>
            <stop offset="100%" stop-color="#16a34a"/>
        </linearGradient>

        <!-- Градієнт для зірочки -->
        <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="100%" stop-color="#eab308"/>
        </linearGradient>
    </defs>

    <!-- Темно-синій фон (іконка застосунку) -->
    <rect x="0" y="0" width="512" height="512" rx="112" fill="#0F172A" />

    <!-- Основа кіноплівки -->
    <rect x="110" y="110" width="292" height="292" rx="16" fill="url(#filmGrad)" filter="url(#shadow)" />

    <!-- Отвори на кіноплівці -->
    <g fill="#0F172A">
        <!-- Лівий ряд -->
        <rect x="130" y="130" width="24" height="32" rx="6" />
        <rect x="130" y="190" width="24" height="32" rx="6" />
        <rect x="130" y="250" width="24" height="32" rx="6" />
        <rect x="130" y="310" width="24" height="32" rx="6" />
        <rect x="130" y="370" width="24" height="32" rx="6" />

        <!-- Правий ряд -->
        <rect x="358" y="130" width="24" height="32" rx="6" />
        <rect x="358" y="190" width="24" height="32" rx="6" />
        <rect x="358" y="250" width="24" height="32" rx="6" />
        <rect x="358" y="310" width="24" height="32" rx="6" />
        <rect x="358" y="370" width="24" height="32" rx="6" />
    </g>

    <!-- Галочка: Біла обводка з тінню -->
    <path d="M 120 270 L 220 360 L 410 140"
          fill="none"
          stroke="#ffffff"
          stroke-width="52"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)" />

    <!-- Галочка: Зелена середина -->
    <path d="M 120 270 L 220 360 L 410 140"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Зірочка у нижньому правому куті -->
    <g transform="translate(390, 390) scale(5.5)" filter="url(#shadow)">
        <polygon points="0,-15 4.4,-4.7 15,-4.7 6.4,2.3 9.3,13.2 0,7.3 -9.3,13.2 -6.4,2.3 -15,-4.7 -4.4,-4.7"
                 fill="url(#starGrad)"
                 stroke="#ffffff"
                 stroke-width="2"
                 stroke-linejoin="round" />
    </g>
</svg>